name: Deploy Django Backend to Azure VPS

on:
  push:
    branches:
      - main
    paths:
      - 'core_django/**'
      - 'ws_gateway/**'
      - 'pdf_service/**'
      - 'tts_service/**'
      - 'image_service/**'
      - 'ai_chat_service/**'
      - 'nginx/**'
      - 'docker-compose.cloud.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  lint:
    name: Lint Backend Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black Formatter Check
        run: black --check core_django --exclude="venv/|migrations/|db.sqlite3" || true

      - name: Run Flake8 Syntax Check
        run: flake8 core_django --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: Deploy to Azure VPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VPS_HOST }}
          username: ${{ secrets.AZURE_VPS_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          script: |
            # Di chuyển vào thư mục dự án trên VPS
            cd ${{ secrets.AZURE_VPS_PATH }}
            
            # Cập nhật code mới nhất từ repository
            echo "Fetching and pulling latest code..."
            git fetch origin
            git checkout main
            git pull origin main
            
            # Build và khởi động lại toàn bộ stack dịch vụ trên VPS
            echo "Rebuilding and restarting all containers..."
            docker compose -f docker-compose.cloud.yml up -d --build
              
            # Dọn dẹp Docker images rác để giải phóng dung lượng VPS
            echo "Cleaning up unused Docker images..."
            docker image prune -f
            
            # Hiển thị trạng thái các container sau khi deploy
            echo "Deployment status:"
            docker compose -f docker-compose.cloud.yml ps
